<!DOCTYPE html>
<html>
<head>
    <title>WPISY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <table class="table table-striped">
  <tr>
    <th>Nazwa</th>
    <th>Opis</th>
    <th>Czas</th>
    <th>Data</th>
  </tr>
    {% for wpis in wpisy %}
  <td>{{wpis[0]}}</td>
  <td>{{wpis[1]}}</td>
  <td>{{wpis[2]}}</td>
  <td>{{wpis[3]}}</td>
  <td>
    <form action="/usun" method="post">
      <input type="hidden" name="nazwa_usun" value='{{wpis[0]}}'">
      <input type="submit" value="Usuń">
    </form>
  </td>
  </tr>
  {% endfor %}
  <h1 class="display-3">Dodaj pierwszy Wpis do Trackera</h1>
  <form action="/" method="post">
    
    <input type="text" name="nazwa" placeholder="Nazwa" class="form-control"><br>
    <input type="text" name="opis" placeholder="Opis wpisu" class="form-control"><br>
    <input type="text" name="czas" placeholder="Czas wykonywania" class="form-control"><br>
    <input type="submit" value="Dodaj!" class='btn btn-primary'>

  </form>
 
</table>
</body>
</html>
